<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>results panel preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" />
  <style>
    /* Torus is a commercial typeface ppy distributes under separate terms, and osu-resources
       carries it only as BMFont bitmap binaries — unusable on the web. Drop TorusRegular.woff2
       and TorusSemiBold.woff2 into app/fonts/ (gitignored) and these rules pick them up;
       without them the stack falls through to Quicksand, the closest free geometric face. */
    @font-face {
      font-family: "Torus";
      src: url("./fonts/TorusRegular.woff2") format("woff2");
      font-weight: 400; font-display: swap;
    }
    @font-face {
      font-family: "Torus";
      src: url("./fonts/TorusSemiBold.woff2") format("woff2");
      font-weight: 600; font-display: swap;
    }
    @font-face {
      font-family: "Torus";
      src: url("./fonts/TorusLight.woff2") format("woff2");
      font-weight: 300; font-display: swap;
    }
    body {
      margin: 0; min-height: 100vh; background: #1a1a2e;
      display: flex; flex-direction: column; align-items: center;
      gap: 24px; padding: 32px;
      font-family: "Torus", "Quicksand", system-ui, sans-serif;
      color: #c0c0d0;
    }
    .bar { display: flex; gap: 10px; align-items: center; }
    button.ctl {
      background: #16213e; color: #e879a0; border: 1px solid #2a2a4a;
      border-radius: 8px; padding: 6px 12px; font: inherit; font-size: 13px; cursor: pointer;
    }
    select.ctl {
      background: #16213e; color: #c0c0d0; border: 1px solid #2a2a4a;
      border-radius: 8px; padding: 6px 10px; font: inherit; font-size: 13px;
    }
    .stage { display: flex; justify-content: center; min-height: 700px; }
    .note { font-size: 12px; opacity: 0.7; }
  </style>
</head>
<body>
  <div class="bar">
    <select class="ctl" id="variant"></select>
    <button class="ctl" id="replay-anim">replay animation</button>
    <span class="note" id="status"></span>
  </div>
  <div class="stage" id="stage"></div>

  <script type="module">
    import { buildResultsPanel, resultsPanelCss, JUDGEMENT_COLOUR } from './results/panel.js';
    import { prepareReveal, startReveal } from './results/reveal.js';
    import { uiSounds } from './player/uiSounds.js';

    const style = document.createElement('style');
    style.textContent = resultsPanelCss();
    document.head.append(style);

    const CUTOFFS = { D: 0, C: 0.7, B: 0.8, A: 0.9, S: 0.95, X: 1 };

    // The exact figures from the reference screenshot, so every field can be compared against
    // osu! side by side rather than judged by feel.
    const reference = {
      title: 'Akikaze no Answer',
      artist: 'Flower',
      difficulty: 'Sentimental Memories',
      mapper: 'Nakano-',
      playerName: '-Lilac-',
      avatarUrl: null,
      score: 26464746,
      accuracy: 0.9844,
      rank: 'S',
      cutoffs: CUTOFFS,
      maxCombo: 1445,
      beatmapMaxCombo: 1445,
      pp: 166,
      starRating: 4.81,
      judgements: [
        { label: 'great', value: '893', colour: JUDGEMENT_COLOUR.great },
        { label: 'ok', value: '27', colour: JUDGEMENT_COLOUR.ok },
        { label: 'meh', value: '0', colour: JUDGEMENT_COLOUR.meh },
        { label: 'miss', value: '0', colour: JUDGEMENT_COLOUR.miss },
      ],
      subJudgements: [
        { label: 'slider tick', value: '56', max: '56', colour: JUDGEMENT_COLOUR.sliderTick },
        { label: 'slider end', value: '469', max: '469', colour: JUDGEMENT_COLOUR.sliderEnd },
        { label: 'spinner bonus', value: '29', max: '32', colour: JUDGEMENT_COLOUR.bonus },
        { label: 'spinner spin', value: '45', max: '45', colour: JUDGEMENT_COLOUR.bonus },
      ],
      playedOn: '25 August 2026 6:42 PM',
    };

    const variants = {
      'reference screenshot (S, 98.44%)': reference,
      'SS — ring fills completely': {
        ...reference, rank: 'X', accuracy: 1, score: 30000000, pp: 320,
        judgements: [
          { label: 'great', value: '920', colour: JUDGEMENT_COLOUR.great },
          { label: 'ok', value: '0', colour: JUDGEMENT_COLOUR.ok },
          { label: 'meh', value: '0', colour: JUDGEMENT_COLOUR.meh },
          { label: 'miss', value: '0', colour: JUDGEMENT_COLOUR.miss },
        ],
      },
      'failed S — 100% acc but ranked A': {
        ...reference, rank: 'A', accuracy: 1, maxCombo: 812, pp: 90,
      },
      'no pp / no star rating (manual replay)': {
        ...reference, pp: null, starRating: null, rank: 'B', accuracy: 0.8123,
      },
      'D rank, low accuracy': {
        ...reference, rank: 'D', accuracy: 0.4211, score: 812345, maxCombo: 61, pp: 4,
        judgements: [
          { label: 'great', value: '301', colour: JUDGEMENT_COLOUR.great },
          { label: 'ok', value: '210', colour: JUDGEMENT_COLOUR.ok },
          { label: 'meh', value: '188', colour: JUDGEMENT_COLOUR.meh },
          { label: 'miss', value: '221', colour: JUDGEMENT_COLOUR.miss },
        ],
      },
    };

    const select = document.getElementById('variant');
    for (const name of Object.keys(variants)) {
      const opt = document.createElement('option');
      opt.value = name;
      opt.textContent = name;
      select.append(opt);
    }

    const stage = document.getElementById('stage');
    const status = document.getElementById('status');
    let running = null;

    function show(name, animate) {
      running?.cancel();
      stage.replaceChildren();
      const handle = buildResultsPanel(variants[name], () => {
        status.textContent = 'watch replay clicked';
      });
      stage.append(handle.root);
      if (animate) {
        prepareReveal(handle);
        running = startReveal(handle);
        status.textContent = 'revealing…';
      } else {
        status.textContent = '';
      }
      // Exposed so a screenshot harness can drive the sequence deterministically. Both cancel
      // any in-flight reveal first: without that, two tweens write the same elements and the
      // older one drags the values toward its own end state.
      window.__handle = handle;
      window.__prepare = () => { running?.cancel(); running = null; prepareReveal(handle); };
      window.__reveal = () => { running?.cancel(); running = startReveal(handle); };
    }

    const replayAnimBtn = document.getElementById('replay-anim');
    uiSounds.attachHoverClick(replayAnimBtn, { hover: 'button', click: false });
    replayAnimBtn.addEventListener('click', () => {
      uiSounds.playClick('button');
      show(select.value, true);
    });

    select.addEventListener('change', () => {
      uiSounds.playClick('default');
      show(select.value, true);
    });

    const params = new URLSearchParams(location.search);
    const variantParam = params.get('variant');
    if (variantParam !== null) {
      if (variants[variantParam]) {
        select.value = variantParam;
      } else {
        const keys = Object.keys(variants);
        const idx = parseInt(variantParam, 10);
        if (!isNaN(idx) && keys[idx]) {
          select.value = keys[idx];
        }
      }
    }
    show(select.value, params.get('animate') !== 'false');
    window.__ready = true;
  </script>
</body>
</html>
