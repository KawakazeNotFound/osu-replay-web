<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>replayviewer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&display=swap" />
  <style>
    /* See preview.html for why Torus is not shipped; drop it into app/fonts/ to use it. */
    @font-face { font-family: "Torus"; src: url("/fonts/TorusRegular.woff2") format("woff2");
      font-weight: 400; font-display: swap; }
    @font-face { font-family: "Torus"; src: url("/fonts/TorusSemiBold.woff2") format("woff2");
      font-weight: 600; font-display: swap; }
    @font-face { font-family: "Torus"; src: url("/fonts/TorusLight.woff2") format("woff2");
      font-weight: 300; font-display: swap; }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; overflow: hidden; }
    body {
      background: #12121c; color: #d8d8e4;
      font-family: "Torus", "Quicksand", system-ui, sans-serif;
      display: flex; flex-direction: column;
    }
    .bar {
      flex: 0 0 auto; display: flex; gap: 10px; align-items: center;
      padding: 10px 14px; background: #16213e; border-bottom: 1px solid #2a2a4a;
    }
    .bar input[type="text"] {
      flex: 1; min-width: 0;
      background: #0f1830; color: #e8e8f4; border: 1px solid #2a2a4a;
      border-radius: 8px; padding: 8px 12px; font: inherit; font-size: 13px;
    }
    .bar button, .bar label.file {
      background: #0f3460; color: #e879a0; border: 1px solid #2a2a5a;
      border-radius: 8px; padding: 8px 14px; font: inherit; font-size: 13px; cursor: pointer;
      white-space: nowrap;
    }
    .bar button:hover, .bar label.file:hover { background: #164080; }
    .bar input[type="file"] { display: none; }
    .bar select {
      background: #0f1830; color: #e8e8f4; border: 1px solid #2a2a4a;
      border-radius: 8px; padding: 8px 10px; font: inherit; font-size: 13px; cursor: pointer;
      max-width: 150px;
    }
    #status { font-size: 12px; opacity: 0.8; white-space: nowrap; }

    /* Signed-in chip, laid out like osu!'s own toolbar: name, then a rounded avatar. */
    .user-chip {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 2px 4px 2px 10px;
      background: #192422; border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 999px;
      white-space: nowrap;
    }
    .user-chip-name { font-size: 12px; font-weight: 600; color: #e0ecea; }
    .user-chip-avatar {
      width: 24px; height: 24px; border-radius: 50%; object-fit: cover;
      background: #1b2540;
    }
    .user-chip-logout {
      background: transparent; border: none; color: #7a7a92;
      font-size: 15px; line-height: 1; padding: 2px 4px; cursor: pointer;
      display: inline-flex; align-items: center;
    }
    .user-chip-logout:hover { color: #e879a0; }
    .login-btn {
      background: #4ed9c8; color: #121e1c; border: none;
      border-radius: 999px; padding: 4px 12px; font: inherit; font-size: 12px; font-weight: 600;
      cursor: pointer; transition: all 120ms ease;
    }
    .login-btn:hover { background: #63ecd9; box-shadow: none; }
    #stage { flex: 1 1 auto; min-height: 0; position: relative; overflow: hidden; }

    /* Sub-Header / Secondary Top Bar */
    .rv-sub-header {
      flex: 0 0 44px;
      height: 44px;
      background: #1c2624;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 0 16px;
      position: relative;
      z-index: 30;
      user-select: none;
      font-family: inherit;
      box-sizing: border-box;
    }
    .rv-sub-header[hidden] {
      display: none !important;
    }
    .rv-sub-header-left {
      display: flex;
      align-items: center;
      gap: 16px;
      min-width: 0;
    }
    .rv-sub-header-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    .rv-sub-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 4px;
      color: #e0ecea;
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 600;
      padding: 5px 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 120ms ease;
      white-space: nowrap;
    }
    .rv-sub-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.25);
      color: #ffffff;
    }
    .rv-sub-back-btn {
      background: rgba(255, 255, 255, 0.06);
      color: rgba(255, 255, 255, 0.85);
    }
    .rv-sub-back-btn:hover {
      background: #4a1f28;
      border-color: #ff5577;
      color: #ff7799;
    }
    .rv-sub-title-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }
    .rv-sub-title {
      font-size: 13px;
      font-weight: 700;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .rv-sub-desc {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.6);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>
  <div id="stage"></div>

  <script type="module">
    import { buildFlow } from '/player/flow.js';
    import {
      DifficultyCancelled, loadFromInput, loadLocalReplay, loadAutoFromBeatmap, loadLocalAuto,
    } from '/player/load.js';
    import { cachedUser, completePendingLogin, fetchMe, isLoggedIn, logout, startLogin }
      from '/player/auth.js';
    import { icon, iconCss } from '/results/icons.js';
    import { DEFAULT_SKIN, getAllSkinNames, importCustomSkinFile } from '/player/skins.js';
    import { buildMenuBar, menuBarCss, notify, notificationsCss } from '/player/menubar.js';
    import { buildMatchView, matchViewCss } from '/player/matchView.js';
    import { buildSingleReplayView } from '/player/singleReplayView.js';
    import { uiSounds } from '/player/uiSounds.js';
    import { chooseLocalDifficulty, difficultyPickerCss } from '/player/difficultyPicker.js';
    import { t } from '/player/i18n.js';

    // Inject styles for menubar, matchView, notifications, and icons
    const iconStyle = document.createElement('style');
    iconStyle.textContent = [
      iconCss(), menuBarCss(), matchViewCss(), notificationsCss(), difficultyPickerCss(),
    ].join('\n');
    document.head.append(iconStyle);

    const stageEl = document.getElementById('stage');
    const canvas = document.createElement('canvas');
    canvas.width = 1280;
    canvas.height = 720;

    const flow = buildFlow({ host: stageEl, canvas });

    // One AudioContext for the page
    let audioContext = null;
    const ctx = () => (audioContext ??= new AudioContext());

    let selectedSkin = DEFAULT_SKIN;
    let currentMode = 'replay'; // 'replay' | 'auto' | 'match'
    let lastLoader = null;
    let pendingOsr = null;
    let pendingOsz = null;
    let activeProgressNotification = null;
    let isHome = true;
    let singleReplayView = null;

    const say = (msg, explicitType) => {
      if (!msg) return;
      singleReplayView?.handleProgress?.(msg);
      let determinedType = explicitType;
      if (!determinedType) {
        const lower = msg.toLowerCase();
        if (lower.includes('failed') || lower.includes('error') || lower.includes('invalid') || lower.includes('could not') || lower.includes('失败')) {
          determinedType = 'error';
        } else if (lower.includes('ready') || lower.includes('success') || lower.includes('imported') || lower.includes('signed in') || lower.includes('playing') || lower.includes('成功') || lower.includes('就绪') || lower.includes('已登录')) {
          determinedType = 'success';
        } else if (lower.includes('loading') || lower.includes('fetching') || lower.includes('redirecting') || lower.includes('…') || lower.includes('...') || lower.includes('正在') || lower.includes('加载中')) {
          determinedType = 'progress';
        } else {
          determinedType = 'info';
        }
      }

      if (determinedType === 'progress') {
        if (activeProgressNotification) {
          activeProgressNotification.update(msg, { type: 'progress' });
        } else {
          activeProgressNotification = notify.progress(msg);
        }
      } else {
        if (activeProgressNotification) {
          activeProgressNotification.update(msg, {
            type: determinedType,
            duration: determinedType === 'error' ? 5000 : 3800,
          });
          activeProgressNotification = null;
        } else {
          notify(msg, { type: determinedType });
        }
      }
    };

    /** Options every loader takes; read fresh so a skin change applies to the next load. */
    const loadOptions = () => ({
      audioContext: ctx(),
      canvas,
      log: say,
      skin: selectedSkin,
      chooseDifficulty: chooseLocalDifficulty,
    });

    async function run(loader) {
      lastLoader = loader;
      try {
        say(t('正在加载…', 'loading…'));
        const replay = await loader(loadOptions());
        isHome = false;
        if (singleReplayView) {
          await singleReplayView.finishProgress();
        }
        singleReplayView?.close();
        subSettingsBtn.style.display = 'inline-flex';
        flow.present(replay);
        say(t('准备就绪 — 点击观看回放', 'ready — press Watch replay'));
      } catch (err) {
        if (err instanceof DifficultyCancelled) {
          say(t('已取消难度选择', 'Difficulty selection cancelled'), 'info');
          return;
        }
        console.error(err);
        const errMsg = err instanceof Error ? err.message : String(err);
        singleReplayView?.setStatus(errMsg, 'error');
        say(`${t('加载失败: ', 'failed: ')}${errMsg}`);
        throw err;
      }
    }

    // Hidden file picker for Auto mode
    const autoFileInput = document.createElement('input');
    autoFileInput.type = 'file';
    autoFileInput.accept = '.osz,.zip';
    autoFileInput.style.display = 'none';
    autoFileInput.addEventListener('change', () => {
      const file = autoFileInput.files?.[0];
      if (file) {
        autoFileInput.value = '';
        say(t(`已选择谱面: ${file.name}，正在生成自动演示…`, `Selected beatmap: ${file.name}, generating auto play...`));
        void run(options => loadLocalAuto(file, options));
      }
    });
    document.body.append(autoFileInput);

    // Hidden file pickers for Replay mode
    const osrFileInput = document.createElement('input');
    osrFileInput.type = 'file';
    osrFileInput.accept = '.osr';
    osrFileInput.style.display = 'none';
    osrFileInput.addEventListener('change', () => {
      const file = osrFileInput.files?.[0];
      if (file) {
        osrFileInput.value = '';
        pendingOsr = file;
        if (pendingOsz !== null) {
          say(t(`已载入 ${file.name}，正在启动本地回放…`, `Loaded ${file.name}, starting local replay...`));
          void run(options => loadLocalReplay(pendingOsr, pendingOsz, options));
        } else {
          say(t(`已载入 .osr 回放: ${file.name}，请继续导入 .osz 谱面包`, `Loaded .osr: ${file.name} (now import .osz beatmap)`));
          oszFileInput.click();
        }
      }
    });

    const oszFileInput = document.createElement('input');
    oszFileInput.type = 'file';
    oszFileInput.accept = '.osz,.zip';
    oszFileInput.style.display = 'none';
    oszFileInput.addEventListener('change', () => {
      const file = oszFileInput.files?.[0];
      if (file) {
        oszFileInput.value = '';
        if (currentMode === 'auto') {
          say(t(`已选择谱面: ${file.name}，正在生成自动演示…`, `Selected beatmap: ${file.name}, generating auto play...`));
          void run(options => loadLocalAuto(file, options));
        } else {
          pendingOsz = file;
          if (pendingOsr !== null) {
            say(t(`已载入 ${file.name}，正在启动本地回放…`, `Loaded ${file.name}, starting local replay...`));
            void run(options => loadLocalReplay(pendingOsr, pendingOsz, options));
          } else {
            say(t(`已载入 .osz 谱面包: ${file.name}，请继续导入 .osr 回放文件`, `Loaded .osz: ${file.name} (now import .osr replay)`));
            osrFileInput.click();
          }
        }
      }
    });
    document.body.append(osrFileInput, oszFileInput);

    // ---- Sub-Header (二级顶栏) for Replay & Auto Modes ----
    const subHeader = document.createElement('header');
    subHeader.className = 'rv-sub-header';
    subHeader.hidden = true;

    const subLeftGroup = document.createElement('div');
    subLeftGroup.className = 'rv-sub-header-left';

    const subBackBtn = document.createElement('button');
    subBackBtn.type = 'button';
    subBackBtn.className = 'rv-sub-btn rv-sub-back-btn';
    subBackBtn.append(icon('rewind', { className: 'rv-icon' }));
    const subBackLabel = document.createElement('span');
    subBackLabel.textContent = t('退出', 'Exit');
    subBackBtn.append(subBackLabel);
    uiSounds.attachHoverClick(subBackBtn, { hover: 'button', click: false });
    subBackBtn.addEventListener('click', () => {
      uiSounds.playClick('dialog-dangerous');
      navigateToRoute('home');
    });

    const subTitleInfo = document.createElement('div');
    subTitleInfo.className = 'rv-sub-title-info';
    const subTitle = document.createElement('div');
    subTitle.className = 'rv-sub-title';
    subTitle.textContent = '';
    const subDesc = document.createElement('div');
    subDesc.className = 'rv-sub-desc';
    subDesc.textContent = '';
    subTitleInfo.append(subTitle, subDesc);

    subLeftGroup.append(subBackBtn, subTitleInfo);

    const subRightGroup = document.createElement('div');
    subRightGroup.className = 'rv-sub-header-right';

    const subImportBtn = document.createElement('button');
    subImportBtn.type = 'button';
    subImportBtn.className = 'rv-sub-btn';
    subImportBtn.append(icon('mode-std', { className: 'rv-icon' }));
    const subImportLabel = document.createElement('span');
    subImportLabel.textContent = t('从本地导入…', 'Import Local…');
    subImportBtn.append(subImportLabel);
    uiSounds.attachHoverClick(subImportBtn, { hover: 'button', click: false });
    subImportBtn.addEventListener('click', () => {
      uiSounds.playClick('button');
      if (currentMode === 'auto') {
        autoFileInput.click();
      } else {
        osrFileInput.click();
      }
    });

    const subUrlBtn = document.createElement('button');
    subUrlBtn.type = 'button';
    subUrlBtn.className = 'rv-sub-btn';
    subUrlBtn.append(icon('link', { className: 'rv-icon' }));
    const subUrlLabel = document.createElement('span');
    subUrlLabel.textContent = t('打开链接/ID…', 'Open URL/ID…');
    subUrlBtn.append(subUrlLabel);
    uiSounds.attachHoverClick(subUrlBtn, { hover: 'button', click: false });
    subUrlBtn.addEventListener('click', () => {
      uiSounds.playClick('button');
      menuBar.openUrlPrompt();
    });

    const subSettingsBtn = document.createElement('button');
    subSettingsBtn.type = 'button';
    subSettingsBtn.className = 'rv-sub-btn';
    subSettingsBtn.append(icon('settings', { className: 'rv-icon' }));
    const subSettingsLabel = document.createElement('span');
    subSettingsLabel.textContent = t('设置', 'Settings');
    subSettingsBtn.append(subSettingsLabel);
    subSettingsBtn.style.display = 'none';
    uiSounds.attachHoverClick(subSettingsBtn, { hover: 'button', click: false });
    subSettingsBtn.addEventListener('click', () => {
      uiSounds.playClick('button');
      flow.toggleSettings();
    });

    subRightGroup.append(subImportBtn, subUrlBtn, subSettingsBtn);
    subHeader.append(subLeftGroup, subRightGroup);

    const matchView = buildMatchView({
      host: stageEl,
      getAudioContext: ctx,
      getSkin: () => selectedSkin,
      log: say,
      onExit: () => {
        navigateToRoute('home');
      },
    });

    singleReplayView = buildSingleReplayView({
      host: stageEl,
      onExit: () => {
        navigateToRoute('home');
      },
      onLoadOsr: async (osrFile, oszFile) => {
        pendingOsr = osrFile;
        pendingOsz = oszFile;
        await run(options => loadLocalReplay(osrFile, oszFile, options));
      },
      onLoadAutoOsz: async oszFile => {
        await run(options => loadLocalAuto(oszFile, options));
      },
      onLoadUrl: async url => {
        if (currentMode === 'auto') {
          await run(options => loadAutoFromBeatmap(url, options));
        } else {
          await run(options => loadFromInput(url, options));
        }
      },
    });

    const menuBar = buildMenuBar({
      onSelectMode: mode => {
        navigateToRoute(mode);
      },
      getActiveMode: () => currentMode,
      onOpenMatchRoom: () => {
        navigateToRoute('match');
      },
      onImportUrl: url => {
        if (currentMode === 'auto') {
          void run(options => loadAutoFromBeatmap(url, options));
        } else {
          void run(options => loadFromInput(url, options));
        }
      },
      onImportOsz: file => {
        if (currentMode === 'auto') {
          say(t(`已选择谱面: ${file.name}，正在生成自动演示…`, `Selected beatmap: ${file.name}, generating auto play...`));
          void run(options => loadLocalAuto(file, options));
        } else {
          pendingOsz = file;
          singleReplayView.setPendingFiles(pendingOsr, pendingOsz);
          if (pendingOsr !== null) {
            say(t(`已载入 ${file.name}，正在启动本地回放…`, `Loaded ${file.name}, starting local replay...`));
            void run(options => loadLocalReplay(pendingOsr, pendingOsz, options));
          } else {
            say(t(`已载入 .osz 谱面包: ${file.name}，请继续导入 .osr 回放文件`, `Loaded .osz: ${file.name} (now import .osr replay)`));
          }
        }
      },
      onImportOsr: file => {
        pendingOsr = file;
        singleReplayView.setPendingFiles(pendingOsr, pendingOsz);
        say(t(`已载入 ${file.name}，正在解析回放并查找谱面…`, `Loaded ${file.name}, parsing replay & resolving beatmap...`));
        void run(options => loadLocalReplay(pendingOsr, pendingOsz, options));
      },
      onSelectSkin: skinName => {
        selectedSkin = skinName;
        say(t(`皮肤已切换为: ${skinName}`, `Skin switched to: ${skinName}`));
        if (lastLoader !== null && currentMode !== 'match') void run(lastLoader);
      },
      onImportSkin: async file => {
        try {
          say(t(`正在导入皮肤 ${file.name}…`, `Importing skin ${file.name}...`));
          const name = await importCustomSkinFile(file, ctx());
          selectedSkin = name;
          say(t(`皮肤 "${name}" 导入成功！`, `Skin "${name}" imported successfully!`));
          if (lastLoader !== null && currentMode !== 'match') void run(lastLoader);
        } catch (err) {
          console.error(err);
          say(`${t('皮肤导入失败: ', 'Skin import failed: ')}${err instanceof Error ? err.message : String(err)}`);
        }
      },
      onToggleSettings: () => {
        if (currentMode === 'match') {
          matchView.toggleSettings();
        } else {
          flow.toggleSettings();
        }
      },
      onToggleFullscreen: () => {
        if (document.fullscreenElement !== null) {
          void document.exitFullscreen();
        } else {
          void document.documentElement.requestFullscreen();
        }
      },
      onReload: () => {
        if (lastLoader !== null) void run(lastLoader);
        else say(t('请先加载回放后再重新加载', 'No replay loaded to reload'));
      },
      onExit: () => {
        navigateToRoute('home');
      },
      onSelectMode: mode => {
        navigateToRoute(mode);
      },
      getActiveMode: () => {
        const hash = location.hash.replace(/^#\/?/, '').trim().toLowerCase();
        if (hash === 'match') return 'match';
        if (hash === 'auto') return 'auto';
        if (hash === 'replay') return 'replay';
        return null;
      },
      isHomePage: () => isHome,
      getSelectedSkin: () => selectedSkin,
      getAvailableSkins: () => getAllSkinNames(),
    });

    document.body.prepend(menuBar.root);
    document.body.insertBefore(subHeader, stageEl);

    function updateSubHeaderForMode(mode) {
      subHeader.hidden = true;
    }

    function navigateToRoute(route) {
      const targetHash = (route === 'home' || route === '' || route === '/') ? '#/' : `#/${route}`;
      if (location.hash !== targetHash) {
        location.hash = targetHash;
      } else {
        applyCurrentRoute();
      }
    }

    function applyCurrentRoute() {
      const hash = location.hash.replace(/^#\/?/, '').trim().toLowerCase();
      subSettingsBtn.style.display = 'none';
      subHeader.hidden = true;

      if (hash === 'match') {
        currentMode = 'match';
        isHome = false;
        singleReplayView.close();
        flow.clear();
        menuBar.updateActiveMode('match');
        matchView.openRoomDialog();
      } else if (hash === 'auto') {
        currentMode = 'auto';
        isHome = false;
        matchView.destroy();
        flow.clear();
        menuBar.updateActiveMode('auto');
        singleReplayView.open('auto');
      } else if (hash === 'replay') {
        currentMode = 'replay';
        isHome = false;
        matchView.destroy();
        flow.clear();
        menuBar.updateActiveMode('replay');
        singleReplayView.open('replay');
      } else {
        // Dedicated Blank Home Page: only the top bar is retained
        currentMode = 'home';
        isHome = true;
        matchView.destroy();
        singleReplayView.close();
        flow.clear();
        menuBar.updateActiveMode(null);
        lastLoader = null;
        pendingOsr = null;
        pendingOsz = null;
      }
    }

    window.addEventListener('hashchange', () => {
      applyCurrentRoute();
    });

    // Run route handling for initial page load
    applyCurrentRoute();

    // ---- osu! sign-in -------------------------------------------------------------------
    function showLoginButton() {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'login-btn';
      button.textContent = t('登录 osu! 账号', 'Login with osu!');
      uiSounds.attachHoverClick(button, { hover: 'button', click: false });
      button.addEventListener('click', () => {
        uiSounds.playClick('button');
        say(t('正在跳转至 osu!…', 'redirecting to osu!…'));
        startLogin().catch(err => say(`${t('登录失败: ', 'login failed: ')}${err.message}`));
      });
      menuBar.userSlot.replaceChildren(button);
    }

    function showUser(user) {
      const chip = document.createElement('span');
      chip.className = 'user-chip';

      const name = document.createElement('span');
      name.className = 'user-chip-name';
      name.textContent = user.username;
      chip.append(name);

      if (user.avatarUrl !== null) {
        const avatar = document.createElement('img');
        avatar.className = 'user-chip-avatar';
        avatar.src = user.avatarUrl;
        avatar.alt = '';
        avatar.addEventListener('error', () => avatar.remove());
        chip.append(avatar);
      }

      const out = document.createElement('button');
      out.type = 'button';
      out.className = 'user-chip-logout';
      out.title = t('退出登录', 'Sign out');
      out.append(icon('power', { className: 'rv-icon', label: t('退出登录', 'Sign out') }));
      uiSounds.attachHoverClick(out, { hover: 'button', click: false });
      out.addEventListener('click', () => {
        uiSounds.playClick('dialog-cancel');
        logout();
        showLoginButton();
        say(t('已退出登录', 'signed out'));
      });
      chip.append(out);

      menuBar.userSlot.replaceChildren(chip);
    }

    async function refreshAuthUi() {
      if (!isLoggedIn()) { showLoginButton(); return; }
      const cached = cachedUser();
      if (cached !== null) showUser(cached);
      try {
        const user = await fetchMe();
        if (user !== null) showUser(user);
        else showLoginButton();
      } catch (err) {
        say(`${t('已登录，但 ', 'signed in, but ')}${err.message}`);
        if (cached === null) showLoginButton();
      }
    }

    // Finish a sign-in that redirected back here before deciding what to show.
    try {
      if (await completePendingLogin()) say(t('已登录', 'signed in'));
    } catch (err) {
      say(err.message);
    }
    // Clean the code out of the address bar so a reload is not mistaken for a fresh callback.
    if (location.search !== '') history.replaceState(null, '', location.pathname + location.hash);
    void refreshAuthUi();

    window.__flow = flow;
    window.__ready = true;
  </script>
</body>
</html>
