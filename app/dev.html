<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>replayviewer — dev</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&display=swap" />
  <style>
    /* See preview.html for why Torus is not shipped; drop it into app/fonts/ to use it. */
    @font-face { font-family: "Torus"; src: url("./fonts/TorusRegular.woff2") format("woff2");
      font-weight: 400; font-display: swap; }
    @font-face { font-family: "Torus"; src: url("./fonts/TorusSemiBold.woff2") format("woff2");
      font-weight: 600; font-display: swap; }
    @font-face { font-family: "Torus"; src: url("./fonts/TorusLight.woff2") format("woff2");
      font-weight: 300; font-display: swap; }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: #12121c; color: #d8d8e4;
      font-family: "Torus", "Quicksand", system-ui, sans-serif;
      display: flex; flex-direction: column;
    }
    .bar {
      flex: 0 0 auto; display: flex; gap: 10px; align-items: center;
      padding: 10px 14px; background: #16213e; border-bottom: 1px solid #2a2a4a;
    }
    .bar input[type="text"] {
      flex: 1; min-width: 0;
      background: #0f1830; color: #e8e8f4; border: 1px solid #2a2a4a;
      border-radius: 8px; padding: 8px 12px; font: inherit; font-size: 13px;
    }
    .bar button, .bar label.file {
      background: #0f3460; color: #e879a0; border: 1px solid #2a2a5a;
      border-radius: 8px; padding: 8px 14px; font: inherit; font-size: 13px; cursor: pointer;
      white-space: nowrap;
    }
    .bar button:hover, .bar label.file:hover { background: #164080; }
    .bar input[type="file"] { display: none; }
    .bar select {
      background: #0f1830; color: #e8e8f4; border: 1px solid #2a2a4a;
      border-radius: 8px; padding: 8px 10px; font: inherit; font-size: 13px; cursor: pointer;
      max-width: 150px;
    }
    #status { font-size: 12px; opacity: 0.8; white-space: nowrap; }

    /* Signed-in chip, laid out like osu!'s own toolbar: name, then a rounded avatar. */
    .user-chip {
      display: inline-flex; align-items: center; gap: 10px;
      padding: 4px 6px 4px 12px;
      background: #0f1830; border: 1px solid #2a2a4a; border-radius: 10px;
      white-space: nowrap;
    }
    .user-chip-name { font-size: 13px; font-weight: 600; color: #e8e8f4; }
    .user-chip-avatar {
      width: 30px; height: 30px; border-radius: 8px; object-fit: cover;
      background: #1b2540;
    }
    .user-chip-logout {
      background: transparent; border: none; color: #7a7a92;
      font-size: 17px; line-height: 1; padding: 2px 4px; cursor: pointer;
      display: inline-flex; align-items: center;
    }
    .user-chip-logout:hover { color: #e879a0; }
    #stage { flex: 1 1 auto; min-height: 0; position: relative; }
  </style>
</head>
<body>
  <div class="bar">
    <input type="text" id="score-url"
           placeholder="score URL / beatmap URL / id" />
    <button id="load-online" type="button">Load</button>
    <label class="file">.osr<input type="file" id="osr" accept=".osr" /></label>
    <label class="file">.osz<input type="file" id="osz" accept=".osz" /></label>
    <button id="load-local" type="button">Load local</button>
    <select id="skin" title="Skin"></select>
    <span id="user-slot"></span>
    <span id="status"></span>
  </div>
  <div id="stage"></div>

  <script type="module">
    import { buildFlow } from './player/flow.js';
    import { loadFromInput, loadLocalReplay } from './player/load.js';
    import { cachedUser, completePendingLogin, fetchMe, isLoggedIn, logout, startLogin }
      from './player/auth.js';
    import { icon, iconCss } from './results/icons.js';
    import { DEFAULT_SKIN, SKIN_NAMES } from './player/skins.js';

    // The flow injects its own stylesheet; icons need theirs before the chip is built.
    const iconStyle = document.createElement('style');
    iconStyle.textContent = iconCss();
    document.head.append(iconStyle);

    const statusEl = document.getElementById('status');
    const say = t => { statusEl.textContent = t; };

    const canvas = document.createElement('canvas');
    canvas.width = 1280;
    canvas.height = 720;

    const flow = buildFlow({ host: document.getElementById('stage'), canvas });

    // One AudioContext for the page: browsers cap how many can exist, and each load would
    // otherwise leak one.
    let audioContext = null;
    const ctx = () => (audioContext ??= new AudioContext());

    // Skin picker. The 12 skins the captured page ships are already served from /skins, so this
    // offers the same set rather than a private one.
    const skinSelect = document.getElementById('skin');
    for (const name of SKIN_NAMES) {
      const option = document.createElement('option');
      option.value = name;
      option.textContent = name;
      if (name === DEFAULT_SKIN) option.selected = true;
      skinSelect.append(option);
    }

    /** Options every loader takes; read fresh so a skin change applies to the next load. */
    const loadOptions = () => ({
      audioContext: ctx(),
      canvas,
      log: say,
      skin: skinSelect.value,
    });

    async function run(loader) {
      try {
        say('loading…');
        const replay = await loader(loadOptions());
        flow.present(replay);
        say('ready — press Watch replay');
      } catch (err) {
        console.error(err);
        say(`failed: ${err instanceof Error ? err.message : String(err)}`);
      }
    }

    document.getElementById('load-online').addEventListener('click', () => {
      const ref = document.getElementById('score-url').value.trim();
      if (ref === '') { say('paste a score URL, beatmap URL, or id'); return; }
      void run(options => loadFromInput(ref, options));
    });

    // ---- osu! sign-in -------------------------------------------------------------------
    const userSlot = document.getElementById('user-slot');

    function showLoginButton() {
      const button = document.createElement('button');
      button.type = 'button';
      button.textContent = 'Login with osu!';
      button.addEventListener('click', () => {
        say('redirecting to osu!…');
        startLogin().catch(err => say(`login failed: ${err.message}`));
      });
      userSlot.replaceChildren(button);
    }

    function showUser(user) {
      const chip = document.createElement('span');
      chip.className = 'user-chip';

      const name = document.createElement('span');
      name.className = 'user-chip-name';
      name.textContent = user.username;
      chip.append(name);

      if (user.avatarUrl !== null) {
        const avatar = document.createElement('img');
        avatar.className = 'user-chip-avatar';
        avatar.src = user.avatarUrl;
        avatar.alt = '';
        // A broken avatar should leave the name readable rather than showing a torn-image icon.
        avatar.addEventListener('error', () => avatar.remove());
        chip.append(avatar);
      }

      const out = document.createElement('button');
      out.type = 'button';
      out.className = 'user-chip-logout';
      out.title = 'Sign out';
      out.append(icon('power', { className: 'rv-icon', label: 'Sign out' }));
      out.addEventListener('click', () => { logout(); showLoginButton(); say('signed out'); });
      chip.append(out);

      userSlot.replaceChildren(chip);
    }

    async function refreshAuthUi() {
      if (!isLoggedIn()) { showLoginButton(); return; }
      // Show the cached identity immediately so the chip does not flicker through a blank state
      // while /me is in flight.
      const cached = cachedUser();
      if (cached !== null) showUser(cached);
      try {
        const user = await fetchMe();
        if (user !== null) showUser(user);
        else showLoginButton();
      } catch (err) {
        // A profile fetch can fail while the session is still fine (osu! outage, rate limit), so
        // keep whatever is shown and say why rather than pretending we are signed out.
        say(`signed in, but ${err.message}`);
        if (cached === null) showLoginButton();
      }
    }

    // Finish a sign-in that redirected back here before deciding what to show.
    try {
      if (await completePendingLogin()) say('signed in');
    } catch (err) {
      say(err.message);
    }
    // Clean the code out of the address bar so a reload is not mistaken for a fresh callback.
    if (location.search !== '') history.replaceState(null, '', location.pathname + location.hash);
    void refreshAuthUi();

    document.getElementById('load-local').addEventListener('click', () => {
      const osr = document.getElementById('osr').files?.[0] ?? null;
      const osz = document.getElementById('osz').files?.[0] ?? null;
      if (osr === null) { say('choose a .osr'); return; }
      void run(options => loadLocalReplay(osr, osz, options));
    });

    window.__flow = flow;
    window.__ready = true;
  </script>
</body>
</html>
