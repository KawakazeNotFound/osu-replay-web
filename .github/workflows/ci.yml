name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      # build = import-boundary check + tsc typecheck/d.ts emit + esbuild bundles
      # + bundle self-containment guard
      - run: npm run build
